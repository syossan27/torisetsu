name: Assign GitHub Copilot as Reviewer

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  assign-copilot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assign GitHub Copilot as reviewer
        if: github.event.action == 'opened'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.issue.number;
            
            try {
              await github.rest.pulls.requestReviewers({
                owner,
                repo,
                pull_number,
                reviewers: ['Copilot']
              });
              console.log('GitHub Copilot has been assigned as a reviewer');
            } catch (error) {
              console.error(`Failed to assign GitHub Copilot as a reviewer: ${error}`);
            }

      - name: Re-request review from GitHub Copilot
        if: github.event.action == 'synchronize'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.issue.number;
            
            try {
              await github.rest.pulls.removeRequestedReviewers({
                owner,
                repo,
                pull_number,
                reviewers: ['Copilot']
              });
              
              await github.rest.pulls.requestReviewers({
                owner,
                repo,
                pull_number,
                reviewers: ['Copilot']
              });
              console.log('Re-requested review from GitHub Copilot');
            } catch (error) {
              console.error(`Failed to re-request review from GitHub Copilot: ${error}`);
            }